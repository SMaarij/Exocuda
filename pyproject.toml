[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade"
version = "0.11.0"
description = "Local-first LLM runtime: runs models on your machine, caches repeated questions, and routes hard ones to a provider or server you choose."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Syed Maarij" }, { name = "Jaweria Anwer" }]
requires-python = ">=3.10"
keywords = ["llm", "ollama", "llama.cpp", "routing", "semantic-cache", "speculative-decoding", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "psutil>=5.9",
    "numpy>=1.26",
    "fastembed>=0.3",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Real speculative decoding (prompt lookup / draft model). CPU wheels:
#   pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
llamacpp = ["llama-cpp-python>=0.3"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://github.com/SMaarij/Exocuda"
Issues = "https://github.com/SMaarij/Exocuda/issues"

[project.scripts]
cascade = "cli.main:app"

[tool.setuptools.packages.find]
include = ["engine*", "gateway*", "cli*", "shared*"]
exclude = ["*.tests*"]

[tool.pytest.ini_options]
# Repo-wide so CI (Section 10.2) picks up every track's tests/
# automatically as they land. pytest simply finds nothing in an
# empty/missing folder, so this stays safe as new folders show up.
# "tests" (repo root) holds cross-track integration tests that don't
# belong to any single track's own folder -- e.g. tests/integration/
# test_j4_three_way_run.py, the first three-way run once all three
# tracks' code exists (Section 13.1's Phase 4 join point).
testpaths = ["engine", "gateway", "cli", "shared", "tests"]
pythonpath = ["."]

[tool.coverage.run]
# Track C landed (gateway/, cli/) -- added below per this file's own
# prior instruction. Track A's own Phase 1 coverage claim (90%
# hardware_profiler.py, 95% backend.py) was measured with
# `--cov=engine/execution` directly -- see docs/archive/TRACK_A_PHASE1_SUMMARY.md.
source = ["engine", "shared", "gateway", "cli"]
omit = ["*/tests/*"]
