[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cascade"
version = "0.2.0"
description = "Adaptive LLM Optimization & Routing Platform"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "numpy>=1.26",
    "fastembed>=0.3",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "stripe>=9.0",
]

[project.optional-dependencies]
# Real speculative decoding (prompt lookup / draft model). CPU wheels:
#   pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
llamacpp = ["llama-cpp-python>=0.3"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
cascade = "cli.main:app"

[tool.setuptools.packages.find]
include = ["engine*", "gateway*", "cli*", "shared*"]
exclude = ["*.tests*"]

[tool.pytest.ini_options]
# Repo-wide so CI (Section 10.2) picks up every track's tests/
# automatically as they land. pytest simply finds nothing in an
# empty/missing folder, so this stays safe as new folders show up.
# "tests" (repo root) holds cross-track integration tests that don't
# belong to any single track's own folder -- e.g. tests/integration/
# test_j4_three_way_run.py, the first three-way run once all three
# tracks' code exists (Section 13.1's Phase 4 join point).
testpaths = ["engine", "gateway", "cli", "shared", "tests"]
pythonpath = ["."]

[tool.coverage.run]
# Track C landed (gateway/, cli/) -- added below per this file's own
# prior instruction. Track A's own Phase 1 coverage claim (90%
# hardware_profiler.py, 95% backend.py) was measured with
# `--cov=engine/execution` directly -- see docs/TRACK_A_PHASE1_SUMMARY.md.
source = ["engine", "shared", "gateway", "cli"]
omit = ["*/tests/*"]
