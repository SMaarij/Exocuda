name: CI

# Section 10.2: "Every pull request runs the full test suite (NFR-09)
# before it can merge, so a break in either seam is caught by a machine
# within minutes of being pushed, not days later on a sync call."
#
# This runs pytest across the WHOLE repo, not just engine/execution/, so
# it picks up Track B's engine/intelligence/tests/ and Track C's
# gateway/tests/ / cli/tests/ automatically as they land -- no change
# needed here when those folders show up.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # NFR-06: "The local engine SHALL run on macOS, Windows, and
        # Linux with 8GB RAM minimum." Testing all three here catches a
        # platform-specific break (e.g. a detect_gpu() path, a path
        # separator) at PR time instead of on a user's machine.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite with coverage
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml -v

      # NFR-09: each component's tests must reach >= 70% coverage,
      # independent of a live GPU or live Ollama instance. This step
      # doesn't yet enforce that number as a hard gate (no coverage
      # config commits a --cov-fail-under yet) -- flagged for the team
      # to decide the threshold together rather than Track A setting it
      # unilaterally for folders it doesn't own.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml
